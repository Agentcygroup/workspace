[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildability"
version = "0.1.0"
description = "Five-gate buildability framework with convergence (G0) and fixed-point closure"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
