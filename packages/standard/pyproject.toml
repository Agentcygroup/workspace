[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcy-standard"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["agentcy-core"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.agentcy.standard]
version = "1.0.0"
