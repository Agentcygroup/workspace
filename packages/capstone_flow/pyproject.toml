[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentcy-capstone-flow"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["agentcy-core", "agentcy-capstone", "agentcy-kernel"]

[tool.setuptools.packages.find]
where = ["src"]
