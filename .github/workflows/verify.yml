name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -q -e packages/buildability -e packages/autonomy
          pip install -q pytest pyyaml
      - name: Verify
        run: ./scripts/verify.sh
