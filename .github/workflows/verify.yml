name: verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/buildability -e packages/gaps -e packages/attest -e packages/seeds -e packages/autonomy -e packages/complexity
      - run: ./scripts/verify.sh
