name: portable
on:
  push:
    branches: [main]
  pull_request:
jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e packages/core -e packages/portable pytest
      - run: python -m pytest packages/portable/tests -q
      - run: python -c "from portable import TARGETS, PROPERTIES, capability_matrix, validate_matrix; m=capability_matrix(); assert validate_matrix(m)==[], 'matrix invalid'; assert len(m)==6, 'target count drifted'; assert set(TARGETS)=={'linux','macos','windows','bsd','wasi','unknown'}; assert set(PROPERTIES)=={'sovereign','airgapped','offline','idempotent','composable','interoperable'}; print('portable ok on', __import__('sys').platform)"
